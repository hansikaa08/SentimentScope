<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up – Sentiment Scope</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen flex items-center justify-center" style="background: linear-gradient(to bottom, #fdf2f8, white);">
  <div class="form-container">
    <div class="text-center mb-8">
      <div class="logo-icon" style="margin: 0 auto 1rem; width: 3rem; height: 3rem; font-size: 1.25rem;">S</div>
      <h1 class="text-2xl font-bold text-gray-800">Create an Account</h1>
      <p class="text-gray-500 mt-1">Sign up to start using Sentiment Scope</p>
    </div>

    <form id="signupForm">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input type="text" id="name" class="form-input" placeholder="Your full name" required>
      </div>

      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-input" placeholder="Create a password" required minlength="8">
      </div>

      <button type="submit" class="btn-primary w-full">
        Sign Up
      </button>
    </form>

    <div id="verificationSection" class="hidden mt-6">
      <div class="form-group">
        <label class="form-label">Verification Code</label>
        <input type="text" id="verificationCode" class="form-input" placeholder="Enter 6-digit code" maxlength="6">
      </div>
      <button type="button" id="verifyBtn" class="btn-primary w-full">
        Verify Email
      </button>
    </div>

    <p class="text-center text-gray-600 text-sm mt-6">
      Already have an account?
      <a href="login.html" class="text-pink-500 hover:underline font-semibold">Log In</a>
    </p>

    <div id="message" class="mt-4 text-center"></div>
  </div>

  <script type="module">
    import { AuthService } from './js/auth.js';

    const signupForm = document.getElementById('signupForm');
    const verificationSection = document.getElementById('verificationSection');
    const verifyBtn = document.getElementById('verifyBtn');
    const messageDiv = document.getElementById('message');
    let userEmail = '';

    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      try {
        messageDiv.textContent = 'Creating account...';
        messageDiv.className = 'text-center text-blue-500';
        
        const result = await AuthService.register({ name, email, password });
        
        if (result.message) {
          userEmail = email;
          verificationSection.classList.remove('hidden');
          signupForm.classList.add('hidden');
          messageDiv.textContent = 'Verification code sent to your email!';
          messageDiv.className = 'text-center text-green-500';
        }
      } catch (error) {
        messageDiv.textContent = error.message;
        messageDiv.className = 'text-center text-red-500';
      }
    });

    verifyBtn.addEventListener('click', async () => {
      const code = document.getElementById('verificationCode').value.trim();
      
      if (!code) {
        messageDiv.textContent = 'Please enter verification code';
        messageDiv.className = 'text-center text-red-500';
        return;
      }

      try {
        messageDiv.textContent = 'Verifying...';
        messageDiv.className = 'text-center text-blue-500';
        
        const result = await AuthService.verifyEmail({ email: userEmail, code });
        
        if (result.message) {
          messageDiv.textContent = 'Email verified! Redirecting to login...';
          messageDiv.className = 'text-center text-green-500';
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 2000);
        }
      } catch (error) {
        messageDiv.textContent = error.message;
        messageDiv.className = 'text-center text-red-500';
      }
    });
  </script>
</body>
</html>
